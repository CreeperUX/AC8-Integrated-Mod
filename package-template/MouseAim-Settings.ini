; Edit while the game is closed. Applied on the next launch.
; Mouse sensitivity: higher means more direction change per mouse count.
sensitivity=0.10
; HUD target update rate (60..240), not a guarantee of display FPS.
hud_fps=120
; Camera direction response (2..20); larger = faster. Default 8.
follow_rate=8
; Independent horizon return (0..10); smaller = gentler, 0 disables.
level_rate=3

; Preserve screen displacement through zoom without anchoring the target to screen.
mouse_reference_fov=62
; Legacy startup/fallback braking; does not set full-model damping.
arrival_braking=1.15

; Model-based primary control; F4 switches PEACE/WAR, F8 toggles mouse control.
model_assist=1
model_assist_strength=0.20

; Default3: native reticle + on-demand panel/toasts. 2=native only,1=legacy GPU,0=GDI.
hud_renderer=3
hud_connector=1
hud_link_always=0
hud_opacity=0.65
; Reference gun cross at the nose: 1=shown, 0=hidden at startup. Alt+F7 toggles it in flight (this session only).
hud_boresight=1

; Startup mode: 0=PEACE (CLASSIC 2.0), 3=WAR (2.4.0 exact-model WAR). F4 toggles PEACE/WAR; legacy 1->0, 2/4/5->3.
control_mode=0

; Camera: 0=game camera, 1=far follow. F3 toggles for the current session.
camera_mode=1
camera_distance_m=36
camera_height_m=6

; Additional optical magnification only while holding C + RMB (1..3).
free_look_zoom=1.75
