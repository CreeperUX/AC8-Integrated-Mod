[control]
; 0.2.5: rate-limited controller with braking. Legacy gain/damping
; entries below are retained for compatibility, but do not tune this mode.
; Mouse counts to world-space target angle, in degrees.
sensitivity=0.10

; Outer-loop response. Raise gently (0.005 steps) if tracking feels lazy.
roll_gain=0.022
pitch_gain=0.026
yaw_gain=0.012
turn_pull=0.42
max_bank=65.0
smoothing=0.12

; Angular-rate damping and arrival dead zone. These prevent alternating
; full corrections after the nose has crossed the target direction.
roll_damping=0.008
pitch_damping=0.010
yaw_damping=0.30
dead_zone=1.25

; Flip one sign if that axis moves opposite to the target marker.
pitch_sign=1
roll_sign=-1
yaw_sign=-1

; Target-marker projection for the default chase camera.
horizontal_fov=100.0
vertical_fov=62.0

; Build 25201480 input layout: slot 1 is yaw.
pitch_slot=0
roll_slot=2

; HUD target update rate; independent of game FPS. 60..240, reload with F10.
hud_fps=120

; Preserve screen displacement through zoom without anchoring the target to screen.
mouse_reference_fov=62
; 1.0 restores old arrival braking; 1.15 is gentle predictive braking.
arrival_braking=1.15

; Actual bounded model-based braking assist; enabled by default; no new hotkey.
model_assist=1
model_assist_strength=0.20

; GPU compositor=1, legacy small windows=0. Backend selected at startup.
hud_renderer=1
hud_connector=1
hud_link_always=0
hud_opacity=0.65

; Startup policy: 0=CLASSIC 2.0, 1=AGILE 2.1. F4 switches in flight.
control_mode=1

; Camera: 0=game camera, 1=far follow. F3 toggles for the current session.
camera_mode=1
camera_distance_m=36
camera_height_m=6
