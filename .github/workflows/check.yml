name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate-source.py
      - run: python -X utf8 tools/check-localization.py
      - run: native\test.cmd
        shell: cmd
      - run: python -X utf8 tests/test_native_style.py
      - run: python -X utf8 tests/test_mod_mode.py
      - run: python -X utf8 tests/test_helmet.py
      - run: python -X utf8 tests/test_visuals.py
      - run: python -X utf8 tests/test_integration.py
      - run: python -X utf8 tests/test_missile_modes.py
      - run: python -X utf8 tests/test_observation.py
      - run: python -X utf8 tests/test_view_context.py
      - run: .\tests\Test-Features.ps1
        shell: powershell
      - run: .\tests\Test-Setup.ps1
        shell: powershell
      - run: .\tests\Test-Package.ps1
        shell: powershell
      - run: .\tests\Test-Cleanup.ps1
        shell: powershell
      - run: .\tests\Test-InstallUX.ps1
        shell: powershell
      - run: .\tests\Test-GUI.ps1
        shell: powershell
      - run: .\tests\Test-CreeperUXTheme.ps1
        shell: powershell
      - run: .\tests\Test-Discovery.ps1
        shell: powershell

      - run: .\tests\Test-HostIsolation.ps1
        shell: powershell
      - run: .\tests\Test-SteamBridge.ps1
        shell: powershell
      - run: .\tests\Test-GuiLayout.ps1
        shell: powershell
      # -File like Start-GUI.cmd: the dialog's event closures resolve the launcher's functions at global scope.
      - run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File tests\Test-Keybindings.ps1
        shell: cmd

      - name: Build and check the fixed English supplement
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((Get-Content version.json -Raw | ConvertFrom-Json).version -ne '2.3.6') {
            Write-Host 'Fixed English supplement belongs to v2.3.6; this Beta ships its own Chinese package.'
            exit 0
          }
          $download = 'native/test-runtime/english-baseline'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          gh release download v2.3.6 --repo CreeperUX/AC8-Integrated-Mod --pattern AC8-Integrated-v2.3.6-share.zip --dir $download
          if ($LASTEXITCODE) { throw 'Baseline download failed' }
          $zip = Join-Path $download 'AC8-Integrated-v2.3.6-share.zip'
          if ((Get-FileHash -LiteralPath $zip).Hash -ne 'BF1B23902D63B16F0219B109B0BE756E2161E0C0248E3D11F11FFB0E89A0DA51') { throw 'Released baseline changed' }
          Expand-Archive -LiteralPath $zip -DestinationPath $download
          python -X utf8 scripts/build-english-package.py --baseline "$download/AC8-Integrated-v2.3.6-share" --output native/test-runtime/AC8-English-CI
          if ($LASTEXITCODE) { throw 'English build failed' }
          & ./tests/Test-EnglishEdition.ps1 -PackageRoot native/test-runtime/AC8-English-CI
          if ($LASTEXITCODE) { throw 'English validation failed' }
